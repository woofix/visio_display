name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: web/requirements-dev.txt

      - name: Install dependencies
        working-directory: web
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: web
        run: ruff check .

      - name: Test (pytest)
        working-directory: web
        run: pytest

      - name: Audit dependencies (pip-audit)
        working-directory: web
        run: pip-audit -r requirements.txt
