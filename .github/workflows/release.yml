name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid VERSION value: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Check existing tag
        id: existing_tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.existing_tag.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Visio-Display ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Check existing release
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes
        if: steps.existing_release.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          repo_url="https://github.com/${GITHUB_REPOSITORY}"
          docs_url="${repo_url}/tree/${tag}"
          previous_tag="$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$' | grep -v "^${tag}$" | head -n 1 || true)"

          {
            echo "## Visio-Display ${version}"
            echo
            echo "### Français"
            echo
            echo "Application web de signalétique numérique pour diffuser des images, vidéos, campagnes et informations sur plusieurs écrans."
            echo
            echo "### Documentation"
            echo
            echo "- [README](${docs_url}/README.md)"
            echo "- [Guide utilisateur](${docs_url}/GUIDE_UTILISATEUR.md)"
            echo "- [Politique de sécurité](${docs_url}/SECURITY.md)"
            echo
            echo "### Changements inclus"
            echo
            if [ -n "$previous_tag" ]; then
              git log --pretty='- %s (`%h`)' "${previous_tag}..HEAD"
            else
              git log --pretty='- %s (`%h`)' HEAD
            fi
            echo
            echo "---"
            echo
            echo "### English"
            echo
            echo "Lightweight web-based digital signage application for displaying images, videos, campaigns and information across multiple screens."
            echo
            echo "### Documentation"
            echo
            echo "- [README](${docs_url}/README.md)"
            echo "- [User guide](${docs_url}/GUIDE_UTILISATEUR.md)"
            echo "- [Security policy](${docs_url}/SECURITY.md)"
            echo
            echo "### Included changes"
            echo
            if [ -n "$previous_tag" ]; then
              git log --pretty='- %s (`%h`)' "${previous_tag}..HEAD"
            else
              git log --pretty='- %s (`%h`)' HEAD
            fi
          } > release_notes.md

      - name: Create GitHub release
        if: steps.existing_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Visio-Display ${{ steps.version.outputs.version }}" \
            --latest \
            --notes-file release_notes.md
