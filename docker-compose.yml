services:
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

  app:
    build: .
    container_name: Visio
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - VISIO_DATA_DIR=/app/data
    volumes:
      - ./.env:/app/.env
      - ${MEDIA_DIR:-./.data/media}:/app/static/data
      - ${PRIVATE_DIR:-./.data/private}:/app/data
    ports:
      - "${PORT:-8081}:8080"
    restart: always
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build: .
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - VISIO_DATA_DIR=/app/data
    volumes:
      - ./.env:/app/.env
      - ${MEDIA_DIR:-./.data/media}:/app/static/data
      - ${PRIVATE_DIR:-./.data/private}:/app/data
    command: rq worker --url redis://redis:6379 visio-display:upload visio-display:compress
    restart: always
    depends_on:
      - redis

volumes:
  redis_data:
