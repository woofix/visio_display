<!DOCTYPE html>
<html lang="{{ lang | default('fr') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Houston, we have a problem - Visio Display</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/access-denied.css', v=static_version) }}">
</head>
<body>
    <main class="access-page" aria-labelledby="access-title">
        <img class="access-bg" src="{{ url_for('static', filename='images/access-denied-mission-control.png', v=static_version) }}" alt="">
        <div class="light-flicker" aria-hidden="true">
            <span class="red-light red-light-one"></span>
            <span class="red-light red-light-two"></span>
            <span class="red-light red-light-three"></span>
            <span class="red-light red-light-four"></span>
            <span class="desk-light desk-light-one"></span>
            <span class="desk-light desk-light-two"></span>
            <span class="desk-light desk-light-three"></span>
        </div>
        <section class="access-hero">
            <div class="access-copy">
                <p class="access-brand">Visio Display · Mission Control</p>
                <h1 id="access-title" class="glitch-title" data-text="Houston, we have a problem">Houston, we have a problem</h1>
                <p class="access-message">This display is not authorized to join the broadcast. Check the screen token or return through the official entry point.</p>
                <div class="access-status" aria-hidden="true">
                    <span class="status-dot"></span>
                    <span>Signal denied</span>
                    <strong>403</strong>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
