<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diaporama</title>
    <style>:root { --media-halo-rgb: {{ display_halo_rgb | default('138, 43, 226') }}; }</style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/display-screen.css', v=static_version) }}">
</head>
<body>
<div id="screen-switcher" class="screen-switcher">
    <span class="screen-switcher-label">Écran</span>
</div>
<div id="priority-alert" class="priority-alert" aria-live="polite" aria-atomic="true">
    <div class="priority-alert-label">Alerte prioritaire</div>
    <div id="priority-alert-message" class="priority-alert-message"></div>
</div>
<script id="display-config" type="application/json">{{ {'defaultScreenName': default_screen_name, 'displayApiToken': display_api_token}|tojson }}</script>
<script src="{{ url_for('static', filename='js/display-screen.js', v=static_version) }}"></script>
</body>
</html>
